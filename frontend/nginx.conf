server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No URI suffix on proxy_pass: preserve /api and the original query string.
    location = /api {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params_zone;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params_zone;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
